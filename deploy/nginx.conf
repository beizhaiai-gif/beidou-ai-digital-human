# 北抖AI数字人 · nginx 站点配置
#
# 放到 /etc/nginx/conf.d/beizhai.conf，把 __DOMAIN__ 换成真实域名。
# 证书用 certbot 签：certbot --nginx -d __DOMAIN__

server {
    listen 80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_session_cache shared:SSL:10m;

    # 上传数字人原片动辄 150MB+，默认 1MB 会直接 413
    client_max_body_size 800m;
    client_body_timeout  600s;

    # 视频透传要支持 Range，否则拖动进度条会从头播
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 后端要判断「是不是 HTTPS」，缺这个头登录 cookie 会写不进去
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 渲染 + 时间戳一条片子要十几分钟，但接口本身是异步的，
    # 真正会等很久的只有上传和静态视频，所以读写超时给足
    proxy_connect_timeout 60s;
    proxy_send_timeout    900s;
    proxy_read_timeout    900s;
    proxy_request_buffering off;
    proxy_buffering off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:5181;
    }

    # 成片和素材是磁盘上的大文件，交给 nginx 直接发，别让 node 扛
    location /jobs/ {
        alias /opt/beizhai-workbench/server/jobs/;
        add_header Cache-Control "no-cache";
        # 不列目录（里面有 source.mp4 这类中间产物）
        autoindex off;
        try_files $uri =404;
    }

    # 轨道工作台反代（后端内部转发到 5199），websocket 要单独放行
    location /wb/ {
        proxy_pass http://127.0.0.1:5181;
        proxy_read_timeout 3600s;
    }
}
